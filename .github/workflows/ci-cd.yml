name: CoreOps CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: coreops-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check Go formatting
        working-directory: backend
        run: test -z "$(gofmt -l .)"

      - name: Vet Go code
        working-directory: backend
        run: go vet ./...

      - name: Run Go tests
        working-directory: backend
        run: go test ./...

      - name: Build Go API
        working-directory: backend
        run: go build -o scp-api ./cmd/coreops-api

      - name: Validate observability provisioning and Prometheus rules
        working-directory: deploy/observability
        run: |
          python3 -m unittest discover -p 'test_*.py'
          python3 configure.py
          python3 render_rule_tests.py
          docker compose config --quiet
          docker compose run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.json
          docker compose run --rm --no-deps --entrypoint promtool prometheus test rules /etc/prometheus/rules.test.json

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check frontend formatting
        working-directory: frontend
        run: pnpm format:check

      - name: Check frontend module boundaries
        working-directory: frontend
        run: pnpm check:boundaries

      - name: Build frontend
        working-directory: frontend
        run: pnpm build
