name: CoreOps Debian packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Debian package version (no automatic publication)
        required: true
        default: 0.1.0~dev
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Verify installation logic without host mutations
        run: python3 -B -m unittest scripts/test_packaging.py deploy/test_power_helper.py deploy/test_services_helper.py
      - name: Build package
        env:
          PACKAGE_VERSION: ${{ inputs.version || '0.1.0~pr' }}
          PACKAGE_ARCH: ${{ matrix.architecture }}
        run: python3 scripts/build-deb.py --version "$PACKAGE_VERSION" --arch "$PACKAGE_ARCH"
      - name: Inspect package ownership, paths and maintainer scripts
        run: python3 scripts/verify-deb.py dist/packages/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: coreops-deb-${{ matrix.architecture }}
          path: dist/packages/*
          retention-days: 14

# Signing/upload are deliberately separate: use the publisher with a protected
# GPG key after reviewing a release and choosing the project's license/hosting.
