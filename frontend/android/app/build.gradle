apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Signing material stays outside the repository. Environment values override
// the private properties file, allowing the same configuration in CI.
def signingPropertiesPath = System.getenv('COREOPS_ANDROID_SIGNING_PROPERTIES') ?:
    "${System.getProperty('user.home')}/.config/coreops/android-signing/release.properties"
def signingPropertiesFile = file(signingPropertiesPath)
def releaseProperties = new Properties()
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { releaseProperties.load(it) }
}
def signingValue = { String envName, String propertyName ->
    System.getenv(envName) ?: releaseProperties.getProperty(propertyName)
}
def releaseStore = signingValue('COREOPS_ANDROID_KEYSTORE', 'storeFile')
def releaseAlias = signingValue('COREOPS_ANDROID_KEY_ALIAS', 'keyAlias')
def releaseStorePassword = signingValue('COREOPS_ANDROID_STORE_PASSWORD', 'storePassword')
def releaseKeyPassword = signingValue('COREOPS_ANDROID_KEY_PASSWORD', 'keyPassword')
def hasReleaseSigning = releaseStore && releaseAlias && releaseStorePassword && releaseKeyPassword
def releaseStoreFile = releaseStore ? new File(releaseStore) : null
if (releaseStoreFile != null && !releaseStoreFile.isAbsolute()) {
    releaseStoreFile = new File(signingPropertiesFile.parentFile, releaseStore)
}

android {
    namespace = "com.coreops.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.coreops.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }
}

// Never produce a distributable unsigned APK or silently use the debug key.
gradle.taskGraph.whenReady { graph ->
    def buildsRelease = graph.allTasks.any {
        it.project == project && it.name in ['assembleRelease', 'bundleRelease', 'packageRelease', 'signReleaseBundle']
    }
    if (buildsRelease && (!hasReleaseSigning || !releaseStoreFile.isFile())) {
        throw new GradleException('Release signing is required. Configure COREOPS_ANDROID_SIGNING_PROPERTIES or the COREOPS_ANDROID_* signing variables.')
    }
}

repositories {
    flatDir {
        dirs '../node_modules/@capacitor/android/capacitor/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':capacitor-android')

    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.drawerlayout:drawerlayout:1.2.0"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.google.android.material:material:$materialVersion"

    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"

    testImplementation "junit:junit:$junitVersion"
}

apply from: 'capacitor.build.gradle'
